<script>
    const n1 = prompt("Digite o primeiro número:");
        const valor1 = n1 + 2;
        const valor2 = n1 - 2;
        const valor3 = n1 % 2;
        const valor4 = n1 * 2;
            alert(`O valor digitado foi: ${n1} \nO valor somado com 2 é: ${valor1} \nO valor subtraído com 2 é: ${valor2} \nO resto da divisão por 2 é: ${valor3} \nO valor multiplicado por 2 é: ${valor4}`)
</script>
